async function weather(){const [city]=place.split(',');const read=document.getElementById('weather-reading'),note=document.getElementById('weather-note');if(typeof weatherAPIKey==='undefined'||!weatherAPIKey){read.textContent='Unavailable';note.textContent='Live weather needs the existing weather API key configured in config.js.';return}try{const r=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=imperial&appid=${weatherAPIKey}`);if(!r.ok)throw 0;const w=await r.json();read.textContent=Math.round(w.main.temp)+'°F · '+w.weather[0].main;note.textContent='Current conditions for '+place+'.'}catch{read.textContent='Unavailable';note.textContent='Live weather could not be retrieved right now.'}}weather();
